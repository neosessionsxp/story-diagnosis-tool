name = "story-diagnosis-tool"
main = "src/index.js"
compatibility_date = "2026-01-15"

[assets]
directory = "./public"

# ── Abuse protection (added 2026-09-09) ──────────────────────────────────────
# The three AI endpoints below spend real Anthropic credits on every call and
# require no sign-in, so an unattended script could drain the account. These are
# Cloudflare's native rate-limit bindings: they cost nothing and, unlike a
# KV-based counter, they consume none of the account's 1,000 KV writes/day —
# which the Tin House and FluidScriptr workers already share.
#
# `period` accepts only 10 or 60 seconds. These caps are deliberately loose
# enough that no real writer will ever touch them.
#
# Measured 2026-09-09: this limiter is APPROXIMATE and per-datacentre, not an
# exact counter. A burst of 30 requests was only blocked twice. It throttles
# sustained hammering, which is the abuse case, but it is not a hard cap — the
# real ceiling on loss is that Anthropic auto-reload stays OFF.

[[unsafe.bindings]]
name = "DIAGNOSE_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 3, period = 60 }

[[unsafe.bindings]]
name = "COACH_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
