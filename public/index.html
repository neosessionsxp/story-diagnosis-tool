     inside a tinhousepress.com iframe — the parent page's analytics can't see
     into an iframe, so this tool needs its own tag to report funnel events. -->

<!-- Marks the document as embedded BEFORE first paint, so the hero block below
     can be hidden without a visible flash. The same headline, feature cards and
     coaching offer now live in the WordPress page above this iframe, where
     Google can actually index them and visitors have something to read while
     the app boots.
     Loaded directly (not in an iframe) the tool still shows its full hero. -->
<script>if (window.parent !== window) document.documentElement.className += ' thp-embedded';</script>
<script>
/* ============================================================================
   Tin House parent-frame relay (added Aug 2026)
   Pairs with WPCode snippet 28382 "GA4 Tool Embed Event Relay" on
   tinhousepress.com. The parent page's GA4 (GT-NM2F7H6M) cannot see into this
   cross-origin iframe, so we postMessage the funnel events up to it. The
   tool's own tag (G-DB88HFMM8D) keeps firing too, so this stream's history
   stays continuous.

   Defined before the app script below, so the React components can call
   thpEvent() straight away. (The app used to be compiled in-browser by
   babel-standalone; the JSX is now precompiled at build time instead.)

   Contract expected by the receiver:
     { type: 'thp:event',  name: <allowlisted>, params: {…primitives, ≤10 keys} }
     { type: 'thp:height', height: <int 200–20000> }
   Allowlisted names: tool_view tool_start tool_complete checkout_click purchase
   ========================================================================== */
(function () {
  // postMessage to a non-matching origin is a silent no-op, so listing both
  // hosts is safe and avoids using '*' as the target origin.
  var PARENT_ORIGINS = [
    'https://tinhousepress.com',
    'https://www.tinhousepress.com'
  ];
  var embedded = window.parent !== window;

  function post(msg) {
    if (!embedded) return;
    for (var i = 0; i < PARENT_ORIGINS.length; i++) {
      try { window.parent.postMessage(msg, PARENT_ORIGINS[i]); } catch (e) {}
    }
  }

  window.thpEvent = function (name, params) {
    params = params || {};
    if (window.gtag) { try { gtag('event', name, params); } catch (e) {} }
    post({ type: 'thp:event', name: name, params: params });
  };

  // Fires once per page, on the first real interaction with the form.
  var started = false;
  window.thpStart = function (how) {
    if (started) return;
    started = true;
    window.thpEvent('tool_start', { method: how || 'unknown' });
  };

  // Auto-resize: tells the parent our real height so it can drop the fixed
  // 1680px / 2500px CSS heights.
  //
  // Do NOT use documentElement.scrollHeight here. While the parent still forces
  // the iframe to 1680px, the inner viewport is 1680px tall, so scrollHeight
  // reports 1680 no matter how short the content is — the frame can then only
  // ever grow, never shrink, and the magic numbers become permanent. Measuring
  // the content wrapper breaks that feedback loop, so this works correctly
  // whether or not the fixed-height CSS is still on the page.
  var CONTENT_SELECTOR = '#root';
  var lastH = 0;

  function contentHeight() {
    var el = document.querySelector(CONTENT_SELECTOR);
    if (!el) return Math.ceil(document.documentElement.scrollHeight);
    var r = el.getBoundingClientRect();
    var top = r.top + (window.pageYOffset || 0);
    var mb = parseFloat(window.getComputedStyle(el).marginBottom) || 0;
    return Math.ceil(top + r.height + mb + 24); // 24px breathing room
  }

  function reportHeight() {
    if (!embedded) return;
    var h = contentHeight();
    if (!h || h < 200 || h > 20000) return;
    if (Math.abs(h - lastH) < 24) return;
    lastH = h;
    post({ type: 'thp:height', height: h });
  }
  window.thpHeight = reportHeight;

  // Any typing or select-change in the app counts as a start, matching how
  // GA4's automatic form_start behaves on the parent page.
  function watchFormStart() {
    var root = document.getElementById('root');
    if (!root) return;
    root.addEventListener('input', function () { window.thpStart('form_input'); }, true);
    root.addEventListener('change', function () { window.thpStart('form_select'); }, true);
  }

  function startWatch() {
    watchFormStart();
    reportHeight();
    if (typeof ResizeObserver === 'function') {
      try { new ResizeObserver(reportHeight).observe(document.body); } catch (e) {}
    }
    window.addEventListener('resize', reportHeight, false);
    // React mounts from the inline app script, after DOMContentLoaded.
    setTimeout(reportHeight, 300);
    setTimeout(reportHeight, 1500);
    setTimeout(reportHeight, 4000);
  }

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    startWatch();
  } else {
    document.addEventListener('DOMContentLoaded', startWatch, false);
  }
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Chau+Philomene+One:ital@0;1&family=Open+Sans+Condensed:wght@300;700&family=Open+Sans:ital,wght@0,300;0,400;0,600;1,400&family=PT+Sans:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #E8ECF1;
    --bg2:       #F0F2F5;
    --surface:   #F4F6F9;
    --border:    rgba(0,0,0,0.07);
    --amber:     #E84040;
    --amber-dim: #C42830;
    --cream:     #1A1A2E;
    --navy:      #1A1A2E;
    --muted:     #6B7280;
    --text:      #2D3A4A;
    --text2:     #5A6A7E;
    --green:     #059669;
    --red:       #E84040;
    --red-rim:   rgba(232,64,64,0.4);
    --nm-l:      #FFFFFF;
    --nm-d:      #C4CAD4;
    --radius:    14px;
    --r-full:    999px;
    --sh-raise:  -6px -6px 14px var(--nm-l),6px 6px 14px var(--nm-d);
    --sh-raise-sm: -3px -3px 8px var(--nm-l),3px 3px 8px var(--nm-d);
    --sh-inset:  inset -4px -4px 10px var(--nm-d),inset 4px 4px 10px var(--nm-l);
    --sh-inset-sm: inset -3px -3px 7px var(--nm-d),inset 3px 3px 7px var(--nm-l);
    --sh-card:   -10px -10px 24px var(--nm-l),10px 10px 24px var(--nm-d),inset 1px 1px 2px rgba(255,255,255,0.5);
    --sh-red:    -3px -3px 7px rgba(255,255,255,0.45),5px 7px 18px rgba(160,15,15,0.45);
    --tr:        all 0.2s cubic-bezier(0.32,0.08,0.24,1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Open Sans', sans-serif;
    font-weight: 400;
    line-height: 1.7;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* Duplicated into the WordPress page — see the note in <head>. */
  html.thp-embedded .embed-hide { display: none; }

  /* The hero supplied ALL of this tool's top spacing (64px padding + 40px
     margin) because .container below has zero top padding — unlike the
     manuscript tool, where the hidden intro sits INSIDE a container that
     already pads 3rem. Hiding the hero here would otherwise slam the phase
     bar flush against the top edge of the iframe. Restore it explicitly.
     getBoundingClientRect().height includes padding, so the auto-resize
     still measures correctly. */
  html.thp-embedded #root { padding-top: 40px; }

  /* ── HEADER ── */
  header {
    background: var(--bg);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 6px 16px rgba(196,202,212,0.55);
    position: relative;
    z-index: 5;
  }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--amber);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Open Sans', 'Inter', sans-serif;
    font-size: 16px;
    color: #fff;
    flex-shrink: 0;
    font-weight: 800;
    box-shadow: var(--sh-red);
  }
  .logo-text {
    font-family: 'Open Sans', 'Inter', sans-serif;
    font-size: 17px;
    color: var(--navy);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 800;
  }
  .logo-text span { color: var(--amber); }

  /* ── HERO ── */
  .hero {
    text-align: center;
    padding: 64px 24px 48px;
    max-width: 700px;
    margin: 0 auto;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 16px;
    font-family: 'Open Sans', 'Inter', sans-serif;
    font-weight: 700;
  }
  .hero h1 {
    font-family: 'Open Sans', sans-serif;
    font-size: clamp(34px, 5.5vw, 54px);
    font-weight: 800;
    color: var(--navy);
    line-height: 1.12;
    letter-spacing: -0.03em;
    margin-bottom: 18px;
  }
  .hero h1 em { font-style: italic; color: var(--amber); }
  .hero p {
    font-size: 16px;
    color: var(--muted);
    max-width: 520px;
    margin: 0 auto;
  }

  /* ── PHASE INDICATOR ── */
  .phases {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin: 0 auto 48px;
    max-width: 500px;
    padding: 0 24px;
  }
  .phase-step {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }
  .phase-step.active { color: var(--navy); font-weight: 600; }
  .phase-step.done { color: var(--amber); }
  .phase-dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
    color: var(--muted);
    background: var(--bg);
    box-shadow: var(--sh-inset-sm);
  }
  .phase-step.active .phase-dot {
    background: var(--amber);
    color: #fff;
    box-shadow: var(--sh-red);
  }
  .phase-step.done .phase-dot {
    color: var(--amber);
    background: var(--bg);
    box-shadow: var(--sh-raise-sm);
  }
  .phase-line {
    flex: 1;
    height: 1px;
    background: var(--border);
    margin: 0 12px;
  }

  /* ── MAIN CONTAINER ── */
  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── FORM ── */
  .card {
    background: var(--bg);
    border: none;
    border-radius: 24px;
    padding: 40px;
    box-shadow: var(--sh-card);
  }

  .field { margin-bottom: 28px; }
  .field label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--navy);
    margin-bottom: 6px;
    font-family: 'Open Sans', 'Inter', sans-serif;
    font-weight: 700;
  }
  .field .hint {
    font-size: 14px;
    color: #444;
    margin-bottom: 8px;
    font-style: normal;
    border-left: 3px solid var(--amber);
    padding-left: 8px;
  }
  .field input, .field select, .field textarea {
    width: 100%;
    background: var(--surface);
    border: none;
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'Inter', 'Open Sans', sans-serif;
    font-size: 15px;
    font-weight: 400;
    padding: 12px 15px;
    outline: none;
    transition: box-shadow 0.2s;
    resize: vertical;
    box-shadow: var(--sh-inset-sm);
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    box-shadow: var(--sh-inset-sm), 0 0 0 2px var(--red-rim);
  }
  .field input::placeholder, .field textarea::placeholder {
    color: #bbb;
    font-style: normal;
    font-family: 'Open Sans', sans-serif;
    font-size: 13px;
    font-weight: 300;
  }
  .field select option { background: #fff; color: #1A1A2E; }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

  /* ── BUTTONS ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 28px;
    border-radius: var(--r-full);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    transition: var(--tr);
    text-decoration: none;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: var(--amber);
    color: #fff;
    width: 100%;
    box-shadow: var(--sh-red);
  }
  .btn-primary:hover { background: var(--amber-dim); transform: translateY(-2px); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-outline {
    background: var(--bg);
    color: var(--text2);
    box-shadow: var(--sh-inset-sm);
  }
  .btn-outline:hover { color: var(--amber); }

  /* ── DIAGNOSIS RESULTS ── */
  .score-ring-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 36px;
  }
  .score-ring {
    position: relative;
    width: 140px; height: 140px;
    margin-bottom: 16px;
  }
  .score-ring svg { transform: rotate(-90deg); }
  .score-ring .score-num {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .score-num .num {
    font-family: 'Open Sans', sans-serif;
    font-size: 42px;
    font-weight: 700;
    color: #1A1A2E;
    line-height: 1;
  }
  .score-num .label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 2px;
    font-family: 'Open Sans Condensed', sans-serif;
  }
  .verdict {
    font-family: 'Inter', sans-serif;
    font-size: 19px;
    font-style: italic;
    color: #1A1A2E;
    text-align: center;
    max-width: 560px;
    line-height: 1.4;
  }

  .section-heading {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber);
    font-family: 'Open Sans', 'Inter', sans-serif;
    font-weight: 700;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--amber);
  }

  .result-section { margin-bottom: 32px; }

  .tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag {
    background: rgba(232,64,64,0.08);
    border: 1px solid rgba(232,64,64,0.3);
    color: var(--amber);
    border-radius: 3px;
    padding: 4px 12px;
    font-size: 13px;
  }
  .tag.green {
    background: rgba(5,150,105,0.08);
    border-color: rgba(5,150,105,0.3);
    color: var(--green);
  }

  .issue-card {
    background: var(--bg);
    border: none;
    border-left: 3px solid var(--red);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 12px;
    box-shadow: var(--sh-raise-sm);
  }
  .issue-card .issue-title {
    font-weight: 600;
    color: #1A1A2E;
    margin-bottom: 6px;
    font-size: 14px;
    font-family: 'Open Sans Condensed', sans-serif;
    letter-spacing: 0.03em;
  }
  .issue-card .issue-detail {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .issue-card .fix {
    font-size: 13px;
    color: var(--green);
    display: flex;
    gap: 8px;
    font-weight: 500;
  }
  .issue-card .fix::before { content: '→'; flex-shrink: 0; }

  .green-light-box {
    background: rgba(5,150,105,0.06);
    border: 1px solid rgba(5,150,105,0.25);
    border-radius: var(--radius);
    padding: 20px;
    font-size: 15px;
    color: #1A1A2E;
    line-height: 1.6;
  }

  .steps-list { list-style: none; counter-reset: steps; }
  .steps-list li {
    counter-increment: steps;
    display: flex;
    gap: 14px;
    margin-bottom: 12px;
    font-size: 14px;
    color: var(--text);
  }
  .steps-list li::before {
    content: counter(steps);
    background: var(--amber);
    color: #fff;
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
    font-family: 'Open Sans', 'Inter', sans-serif;
  }

  /* ── PAYWALL ── */
  .paywall {
    background: var(--bg);
    border: none;
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    margin-top: 32px;
    box-shadow: var(--sh-card);
  }
  .paywall h3 {
    font-family: 'Open Sans', 'Inter', sans-serif;
    font-size: 24px;
    color: #1A1A2E;
    margin-bottom: 12px;
  }
  .paywall p { color: var(--muted); margin-bottom: 24px; font-size: 15px; }
  .price-badge {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    background: rgba(232,64,64,0.07);
    border: 1px solid rgba(232,64,64,0.25);
    border-radius: 4px;
    padding: 8px 18px;
    margin-bottom: 24px;
  }
  .price-badge .dollar { font-size: 24px; color: var(--amber); font-weight: 700; font-family: 'PT Sans', sans-serif; }
  .price-badge .cents { font-size: 14px; color: var(--muted); }
  .credit-note {
    font-size: 13px; line-height: 1.6; color: var(--muted);
    text-align: center; margin: 0 0 18px 0; padding: 10px 14px;
    background: rgba(0,0,0,0.03); border-radius: 6px;
  }
  .credit-note strong { color: var(--text, #1a1a1a); font-weight: 600; }
  .paywall-features {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 28px;
    text-align: left;
    max-width: 320px;
    margin-left: auto;
    margin-right: auto;
  }
  .paywall-features li {
    display: flex;
    gap: 10px;
    font-size: 14px;
    color: var(--text);
  }
  .paywall-features li::before { content: '✓'; color: var(--green); font-weight: 700; }

  .unlock-row { display: flex; align-items: center; gap: 16px; justify-content: center; flex-wrap: wrap; }

  /* ── COACH CHAT ── */
  .coach-panel {
    background: var(--bg);
    border: none;
    border-radius: 24px;
    overflow: hidden;
    margin-top: 32px;
    box-shadow: var(--sh-card);
  }
  .coach-header {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg2);
  }
  .coach-header .coach-icon {
    width: 38px; height: 38px;
    background: rgba(232,64,64,0.1);
    border: 1px solid rgba(232,64,64,0.25);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .coach-header .coach-name {
    font-family: 'Open Sans', 'Inter', sans-serif;
    font-size: 17px;
    color: #1A1A2E;
    letter-spacing: 0.04em;
    font-weight: 400;
  }
  .coach-header .coach-sub { font-size: 12px; color: var(--muted); }

  .chat-messages {
    padding: 24px 28px;
    min-height: 260px;
    max-height: 480px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .chat-msg { display: flex; gap: 12px; }
  .chat-msg.user { flex-direction: row-reverse; }
  .msg-bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .chat-msg.user .msg-bubble {
    background: rgba(232,64,64,0.07);
    border: 1px solid rgba(232,64,64,0.2);
    color: #1A1A2E;
    border-bottom-right-radius: 4px;
  }
  .chat-msg.assistant .msg-bubble {
    background: #f7f7f7;
    border: 1px solid #e8e8e8;
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    margin-top: 2px;
  }
  .chat-msg.user .msg-avatar { background: var(--amber); color: #fff; }
  .chat-msg.assistant .msg-avatar { background: #e8e8e8; color: #666; }

  .quick-prompts {
    padding: 0 28px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .quick-btn {
    background: var(--bg);
    border: none;
    border-radius: var(--r-full);
    color: var(--text2);
    font-size: 13px;
    padding: 7px 15px;
    cursor: pointer;
    transition: var(--tr);
    font-family: 'Inter', sans-serif;
    box-shadow: var(--sh-raise-sm);
  }
  .quick-btn:hover { color: var(--amber); transform: translateY(-1px); }
